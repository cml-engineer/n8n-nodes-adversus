name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from package.json to publish
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if(p.private || p.version!==process.env.RELEASE_VERSION || JSON.stringify(p).includes("REPLACE_WITH")) throw Error("Complete release metadata and remove private flag before publication")'
      - run: npm publish --provenance --access public
